<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGrad4)"/>

  <!-- Enterprise Architecture Diagram Deck -->
  <g filter="url(#shadow4)" transform="translate(45, 35)">
    <rect x="0" y="0" width="310" height="210" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

    <!-- Dashboard Header -->
    <rect x="16" y="16" width="278" height="28" rx="6" fill="#1E293B"/>
    <circle cx="30" cy="30" r="4" fill="#EF4444"/>
    <circle cx="42" cy="30" r="4" fill="#F59E0B"/>
    <circle cx="54" cy="30" r="4" fill="#10B981"/>
    <text x="80" y="34" font-family="Inter, sans-serif" font-weight="800" font-size="9" fill="#94A3B8">ENTERPRISE SYSTEM ARCHITECTURE • 10 DEPARTMENTS</text>

    <!-- 3 Core Command Pods -->
    <rect x="16" y="56" width="86" height="74" rx="8" fill="#1E293B" stroke="#43A7E8" stroke-width="1.5"/>
    <text x="24" y="74" font-family="Inter, sans-serif" font-weight="900" font-size="9" fill="#43A7E8">FOUNDER OS</text>
    <text x="24" y="88" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1">• Delegation Rules</text>
    <text x="24" y="100" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1">• KPI Matrix</text>
    <text x="24" y="112" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1">• Capital Flow</text>

    <rect x="112" y="56" width="86" height="74" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="120" y="74" font-family="Inter, sans-serif" font-weight="900" font-size="9" fill="#38BDF8">OPS VAULT</text>
    <text x="120" y="88" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1">• 10 Dept SOPs</text>
    <text x="120" y="100" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1">• QA Framework</text>
    <text x="120" y="112" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1">• Supply Chain</text>

    <rect x="208" y="56" width="86" height="74" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="216" y="74" font-family="Inter, sans-serif" font-weight="900" font-size="9" fill="#38BDF8">GROWTH CRM</text>
    <text x="216" y="88" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1">• 7-Tab Engine</text>
    <text x="216" y="100" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1">• CAC/LTV Track</text>
    <text x="216" y="112" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1">• AI Dispatch</text>

    <!-- Bottom Command Status -->
    <rect x="16" y="142" width="278" height="54" rx="8" fill="#0B1733" stroke="#1E293B" stroke-width="1"/>
    <text x="26" y="162" font-family="Inter, sans-serif" font-weight="800" font-size="9" fill="#10B981">● SYSTEM MATURITY LEVEL 5/5</text>
    <text x="26" y="180" font-family="Inter, sans-serif" font-size="8" fill="#94A3B8">Fully Documented Corporate Infrastructure Ready for Delegation</text>
  </g>
</svg>
