<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="wfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadowWf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgWf)"/>

  <g filter="url(#shadowWf)" transform="translate(30, 25)">
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header Panel -->
    <rect x="0" y="0" width="340" height="42" rx="12" fill="url(#wfGrad)"/>
    <rect x="0" y="24" width="340" height="18" fill="url(#wfGrad)"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">OPERATIONAL WORKFLOW &amp; PIPELINE ENGINE</text>

    <!-- Node Architecture Container -->
    <rect x="18" y="56" width="304" height="158" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Step 1: Customer Intake -->
    <rect x="28" y="76" width="58" height="60" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="57" y="94" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">📥</text>
    <text x="57" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="6.5" font-weight="900" fill="#E2E8F0">1. Intake</text>
    <text x="57" y="124" text-anchor="middle" font-family="Inter, sans-serif" font-size="5.5" fill="#38BDF8">Form/WA</text>

    <!-- Arrow 1 -->
    <path d="M 88 106 L 102 106" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="95" y="102" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="#64748B">→</text>

    <!-- Step 2: Confirmation & Auto-Tag -->
    <rect x="104" y="76" width="58" height="60" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="133" y="94" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">⚡</text>
    <text x="133" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="6.5" font-weight="900" fill="#E2E8F0">2. Verify</text>
    <text x="133" y="124" text-anchor="middle" font-family="Inter, sans-serif" font-size="5.5" fill="#10B981">Auto-OTP</text>

    <!-- Arrow 2 -->
    <path d="M 164 106 L 178 106" stroke="#10B981" stroke-width="2"/>
    <text x="171" y="102" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="#64748B">→</text>

    <!-- Step 3: Packing & Video -->
    <rect x="180" y="76" width="58" height="60" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="209" y="94" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">📦</text>
    <text x="209" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="6.5" font-weight="900" fill="#E2E8F0">3. Pack</text>
    <text x="209" y="124" text-anchor="middle" font-family="Inter, sans-serif" font-size="5.5" fill="#818CF8">SOP Log</text>

    <!-- Arrow 3 -->
    <path d="M 240 106 L 254 106" stroke="#818CF8" stroke-width="2"/>
    <text x="247" y="102" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="#64748B">→</text>

    <!-- Step 4: Dispatch & Tracking -->
    <rect x="256" y="76" width="58" height="60" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="285" y="94" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">🚀</text>
    <text x="285" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="6.5" font-weight="900" fill="#E2E8F0">4. Dispatch</text>
    <text x="285" y="124" text-anchor="middle" font-family="Inter, sans-serif" font-size="5.5" fill="#F59E0B">Steadfast</text>

    <!-- Bottom SLA Performance Box -->
    <rect x="28" y="148" width="286" height="52" rx="6" fill="#0B132B"/>
    <text x="40" y="166" font-family="Inter, sans-serif" font-size="7.5" font-weight="900" fill="#E2E8F0">REAL-TIME FLOW PERFORMANCE</text>
    <text x="40" y="180" font-family="Inter, sans-serif" font-size="6.5" fill="#94A3B8">Average Order Cycle: <tspan fill="#10B981" font-weight="900">48 Minutes (Intake to Ready)</tspan></text>
    <text x="40" y="192" font-family="Inter, sans-serif" font-size="6.5" fill="#94A3B8">System Error Margin: <tspan fill="#38BDF8" font-weight="900">0.00% Zero Manual Drop</tspan></text>
  </g>
</svg>
