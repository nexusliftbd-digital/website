<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43A7E8"/>
      <stop offset="100%" stop-color="#1971A5"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGrad2)"/>

  <!-- Presentation Deck 3D Isometric Spread -->
  <g filter="url(#shadow2)" transform="translate(50, 30)">
    <!-- Back Leaf 2 -->
    <rect x="40" y="20" width="220" height="210" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <!-- Back Leaf 1 -->
    <rect x="20" y="10" width="220" height="210" rx="12" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <!-- Front Master Cover -->
    <rect x="0" y="0" width="220" height="210" rx="12" fill="#FFFFFF"/>

    <!-- Premium Header -->
    <rect x="18" y="20" width="184" height="60" rx="8" fill="url(#goldGrad)"/>
    <text x="32" y="44" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="1">GROWTH PROFILE SUITE</text>
    <text x="32" y="62" font-family="Inter, sans-serif" font-weight="700" font-size="9" fill="#EAF6FF">12-15 Pages • 360° Value Prop</text>

    <!-- Content Sections -->
    <rect x="18" y="92" width="85" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="26" y="102" width="40" height="6" rx="2" fill="#0B1733"/>
    <rect x="26" y="114" width="65" height="4" rx="2" fill="#94A3B8"/>
    <rect x="26" y="122" width="50" height="4" rx="2" fill="#94A3B8"/>

    <rect x="117" y="92" width="85" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="125" y="102" width="40" height="6" rx="2" fill="#1971A5"/>
    <rect x="125" y="114" width="65" height="4" rx="2" fill="#94A3B8"/>
    <rect x="125" y="122" width="50" height="4" rx="2" fill="#94A3B8"/>

    <!-- Organogram Diagram -->
    <rect x="18" y="144" width="184" height="46" rx="6" fill="#EAF6FF" stroke="#BAE6FD" stroke-width="1"/>
    <circle cx="110" cy="158" r="6" fill="#0B1733"/>
    <circle cx="70" cy="176" r="5" fill="#1971A5"/>
    <circle cx="110" cy="176" r="5" fill="#1971A5"/>
    <circle cx="150" cy="176" r="5" fill="#1971A5"/>
    <line x1="110" y1="164" x2="110" y2="171" stroke="#0B1733" stroke-width="1.5"/>
    <line x1="70" y1="171" x2="150" y2="171" stroke="#0B1733" stroke-width="1.5"/>
  </g>

  <!-- Flagship Ribbon Badge -->
  <g transform="translate(255, 20)">
    <rect x="0" y="0" width="115" height="32" rx="16" fill="#FF5722" filter="url(#shadow2)"/>
    <text x="57" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">🔥 FLAGSHIP</text>
  </g>
</svg>
