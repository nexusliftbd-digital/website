<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43A7E8"/>
      <stop offset="100%" stop-color="#1971A5"/>
    </linearGradient>
    <filter id="shadowBrand" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgBrand)"/>

  <!-- Brand Card Container -->
  <g filter="url(#shadowBrand)" transform="translate(30, 25)">
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header Banner -->
    <rect x="0" y="0" width="340" height="42" rx="12" fill="url(#gradAccent)"/>
    <rect x="0" y="24" width="340" height="18" fill="url(#gradAccent)"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">BRAND FOUNDATION &amp; IDENTITY KIT</text>

    <!-- Swatches Row -->
    <rect x="18" y="56" width="304" height="44" rx="8" fill="#1E293B"/>
    <text x="28" y="70" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#94A3B8">PALETTE &amp; AUTHORITY TRIGGERS</text>
    <circle cx="36" cy="86" r="8" fill="#071127" stroke="#43A7E8" stroke-width="1.5"/>
    <circle cx="60" cy="86" r="8" fill="#0B1733"/>
    <circle cx="84" cy="86" r="8" fill="#43A7E8"/>
    <circle cx="108" cy="86" r="8" fill="#EAF6FF"/>
    <circle cx="132" cy="86" r="8" fill="#10B981"/>

    <!-- Typography & Voice Grid -->
    <rect x="18" y="108" width="146" height="106" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="28" y="126" font-family="Inter, sans-serif" font-size="9" font-weight="900" fill="#38BDF8">TYPOGRAPHY HIERARCHY</text>
    <text x="28" y="146" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">Hind &amp; Inter</text>
    <text x="28" y="162" font-family="Inter, sans-serif" font-size="8" fill="#94A3B8">Aa Bb Cc Dd 12345</text>
    <rect x="28" y="174" width="120" height="4" rx="2" fill="#334155"/>
    <rect x="28" y="182" width="90" height="4" rx="2" fill="#334155"/>
    <rect x="28" y="190" width="105" height="4" rx="2" fill="#334155"/>

    <!-- Positioning Matrix -->
    <rect x="176" y="108" width="146" height="106" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="186" y="126" font-family="Inter, sans-serif" font-size="9" font-weight="900" fill="#10B981">VALUE PROPOSITION</text>
    <rect x="186" y="136" width="126" height="22" rx="4" fill="#0B132B"/>
    <text x="194" y="150" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">360° Market Differentiation</text>
    <rect x="186" y="164" width="126" height="22" rx="4" fill="#0B132B"/>
    <text x="194" y="178" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#EAF6FF">B2B Trust &amp; Conversion Voice</text>
    <rect x="186" y="192" width="60" height="14" rx="3" fill="#10B981"/>
    <text x="193" y="202" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#071127">✓ READY</text>
  </g>
</svg>
