<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradWomen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <filter id="shadowWomen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGradWomen)"/>

  <!-- Women Starter Kit Mockup -->
  <g filter="url(#shadowWomen)" transform="translate(60, 30)">
    <!-- Binder Folder -->
    <rect x="0" y="0" width="225" height="215" rx="12" fill="#FFFFFF"/>

    <!-- Floral / Elegant Header -->
    <rect x="16" y="16" width="193" height="50" rx="8" fill="#FDF2F8" stroke="#F472B6" stroke-width="1"/>
    <text x="28" y="38" font-family="Inter, sans-serif" font-weight="900" font-size="10" fill="#9D174D" letter-spacing="1">WOMEN ENTREPRENEUR KIT</text>
    <text x="28" y="52" font-family="Hind Siliguri, sans-serif" font-weight="700" font-size="8.5" fill="#BE185D">ট্রেড লাইসেন্স ও কস্টিং ক্যালকুলেটর</text>

    <!-- 3 Core Tools -->
    <rect x="16" y="76" width="193" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="26" y="94" font-family="Hind Siliguri, sans-serif" font-weight="700" font-size="8" fill="#0B1733">📋 ট্রেড লাইসেন্স অ্যান্ড লিগ্যাল চেকলিস্ট</text>

    <rect x="16" y="116" width="193" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="26" y="134" font-family="Hind Siliguri, sans-serif" font-weight="700" font-size="8" fill="#0B1733">📊 প্রোডাক্ট কস্টিং অ্যান্ড প্রফিট ক্যালকুলেটর</text>

    <rect x="16" y="156" width="193" height="38" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
    <text x="26" y="174" font-family="Hind Siliguri, sans-serif" font-weight="800" font-size="8.5" fill="#065F46">💬 কাস্টমার সাপোর্ট মেসেঞ্জার স্ক্রিপ্ট প্যাক</text>
    <text x="26" y="186" font-family="Inter, sans-serif" font-size="7" fill="#059669">১০০% এডিটেবল এক্সেল ও ওয়ার্ড ফাইল</text>
  </g>

  <!-- BD Kit Badge -->
  <g transform="translate(265, 20)">
    <circle cx="24" cy="24" r="24" fill="#EC4899" filter="url(#shadowWomen)"/>
    <text x="24" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="8" fill="#FFFFFF">BD KIT</text>
    <text x="24" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="7.5" fill="#FFFFFF">৳1,499</text>
  </g>
</svg>
