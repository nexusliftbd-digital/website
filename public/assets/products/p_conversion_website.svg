<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="browserBarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1971A5"/>
    </linearGradient>
    <filter id="shadowWeb" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgWeb)"/>

  <!-- Browser Window Mockup -->
  <g filter="url(#shadowWeb)" transform="translate(30, 25)">
    <!-- Browser Container -->
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#FFFFFF"/>

    <!-- Browser Top Bar -->
    <rect x="0" y="0" width="340" height="34" rx="12" fill="url(#browserBarGrad)"/>
    <rect x="0" y="20" width="340" height="14" fill="url(#browserBarGrad)"/>

    <!-- Window Controls -->
    <circle cx="16" cy="17" r="4" fill="#EF4444"/>
    <circle cx="28" cy="17" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="17" r="4" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="60" y="8" width="190" height="18" rx="6" fill="#334155"/>
    <text x="70" y="20" font-family="Inter, sans-serif" font-size="8" fill="#94A3B8">https://yourbusiness.com/order</text>

    <!-- Webpage Content -->
    <!-- Hero Section in Webpage -->
    <rect x="15" y="46" width="310" height="85" rx="8" fill="url(#cyanBlue)"/>
    <text x="30" y="72" font-family="Inter, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF">CONVERSION HEADQUARTERS</text>
    <text x="30" y="88" font-family="Inter, sans-serif" font-weight="600" font-size="8" fill="#EAF6FF">High-Speed Next.js 16 • WhatsApp & Make.com Connected</text>

    <!-- CTA Button on page -->
    <rect x="30" y="98" width="95" height="22" rx="6" fill="#25D366"/>
    <text x="40" y="112" font-family="Inter, sans-serif" font-weight="800" font-size="8" fill="#FFFFFF">⚡ Order on WhatsApp</text>

    <!-- 3 Value Columns -->
    <rect x="15" y="142" width="95" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="23" y="152" width="30" height="6" rx="2" fill="#0B1733"/>
    <rect x="23" y="164" width="75" height="4" rx="2" fill="#94A3B8"/>
    <rect x="23" y="172" width="60" height="4" rx="2" fill="#94A3B8"/>
    <rect x="23" y="190" width="40" height="12" rx="4" fill="#1971A5"/>

    <rect x="122" y="142" width="95" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="130" y="152" width="30" height="6" rx="2" fill="#10B981"/>
    <rect x="130" y="164" width="75" height="4" rx="2" fill="#94A3B8"/>
    <rect x="130" y="172" width="60" height="4" rx="2" fill="#94A3B8"/>
    <rect x="130" y="190" width="40" height="12" rx="4" fill="#10B981"/>

    <rect x="230" y="142" width="95" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="238" y="152" width="30" height="6" rx="2" fill="#6366F1"/>
    <rect x="238" y="164" width="75" height="4" rx="2" fill="#94A3B8"/>
    <rect x="238" y="172" width="60" height="4" rx="2" fill="#94A3B8"/>
    <rect x="238" y="190" width="40" height="12" rx="4" fill="#6366F1"/>
  </g>

  <!-- Hero Badge -->
  <g transform="translate(265, 15)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#FF5722" filter="url(#shadowWeb)"/>
    <text x="52" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF">🔥 HERO WEBSITE</text>
  </g>
</svg>
