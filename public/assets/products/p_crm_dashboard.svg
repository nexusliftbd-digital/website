<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCrm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="crmHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadowCrm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgCrm)"/>

  <!-- Dashboard Panel Mockup -->
  <g filter="url(#shadowCrm)" transform="translate(30, 25)">
    <!-- Main Window -->
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Left Sidebar -->
    <rect x="0" y="0" width="70" height="230" rx="12" fill="#0B132B"/>
    <rect x="58" y="0" width="12" height="230" fill="#0B132B"/>
    <circle cx="24" cy="24" r="8" fill="#38BDF8"/>
    <text x="38" y="27" font-family="Inter, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF">CRM</text>

    <!-- Sidebar Menu Items -->
    <rect x="10" y="48" width="50" height="14" rx="4" fill="#1E293B"/>
    <text x="16" y="58" font-family="Inter, sans-serif" font-size="7" fill="#38BDF8">● Leads</text>
    <rect x="10" y="68" width="50" height="14" rx="4" fill="transparent"/>
    <text x="16" y="78" font-family="Inter, sans-serif" font-size="7" fill="#64748B">● Pipeline</text>
    <rect x="10" y="88" width="50" height="14" rx="4" fill="transparent"/>
    <text x="16" y="98" font-family="Inter, sans-serif" font-size="7" fill="#64748B">● Orders</text>
    <rect x="10" y="108" width="50" height="14" rx="4" fill="transparent"/>
    <text x="16" y="118" font-family="Inter, sans-serif" font-size="7" fill="#64748B">● Analytics</text>

    <!-- Top Stats Cards -->
    <rect x="82" y="16" width="75" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="90" y="30" font-family="Inter, sans-serif" font-size="7" fill="#94A3B8">Total Leads</text>
    <text x="90" y="48" font-family="Inter, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF">1,480</text>

    <rect x="165" y="16" width="75" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="173" y="30" font-family="Inter, sans-serif" font-size="7" fill="#94A3B8">Conversion Rate</text>
    <text x="173" y="48" font-family="Inter, sans-serif" font-weight="900" font-size="13" fill="#34D399">24.6%</text>

    <rect x="248" y="16" width="75" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="256" y="30" font-family="Inter, sans-serif" font-size="7" fill="#94A3B8">Recovered</text>
    <text x="256" y="48" font-family="Inter, sans-serif" font-weight="900" font-size="13" fill="#38BDF8">৳84,500</text>

    <!-- Main Chart Section -->
    <rect x="82" y="68" width="241" height="85" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="92" y="84" font-family="Inter, sans-serif" font-weight="800" font-size="8" fill="#E2E8F0">Sales & Pipeline Velocity</text>

    <!-- Waveform Chart -->
    <path d="M 95 135 Q 130 95, 160 115 T 230 85 T 310 90 L 310 145 L 95 145 Z" fill="url(#chartGrad)"/>
    <path d="M 95 135 Q 130 95, 160 115 T 230 85 T 310 90" fill="none" stroke="#38BDF8" stroke-width="2.5"/>

    <!-- Bottom Pipeline KanBan row -->
    <rect x="82" y="162" width="56" height="52" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
    <text x="88" y="174" font-family="Inter, sans-serif" font-weight="700" font-size="7" fill="#38BDF8">New (18)</text>
    <rect x="86" y="180" width="48" height="14" rx="2" fill="#1E293B"/>
    <rect x="86" y="198" width="48" height="12" rx="2" fill="#1E293B"/>

    <rect x="144" y="162" width="56" height="52" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
    <text x="150" y="174" font-family="Inter, sans-serif" font-weight="700" font-size="7" fill="#F59E0B">Followup (9)</text>
    <rect x="148" y="180" width="48" height="14" rx="2" fill="#1E293B"/>
    <rect x="148" y="198" width="48" height="12" rx="2" fill="#1E293B"/>

    <rect x="206" y="162" width="56" height="52" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
    <text x="212" y="174" font-family="Inter, sans-serif" font-weight="700" font-size="7" fill="#818CF8">Negotiating (6)</text>
    <rect x="210" y="180" width="48" height="14" rx="2" fill="#1E293B"/>

    <rect x="267" y="162" width="56" height="52" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
    <text x="273" y="174" font-family="Inter, sans-serif" font-weight="700" font-size="7" fill="#34D399">Won (42)</text>
    <rect x="271" y="180" width="48" height="14" rx="2" fill="#1E293B"/>
    <rect x="271" y="198" width="48" height="12" rx="2" fill="#1E293B"/>
  </g>

  <!-- Hero Badge -->
  <g transform="translate(265, 15)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#FF5722" filter="url(#shadowCrm)"/>
    <text x="52" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF">🔥 HERO CRM</text>
  </g>
</svg>
