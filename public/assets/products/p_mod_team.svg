<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="teamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <filter id="shadowTeam" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgTeam)"/>

  <g filter="url(#shadowTeam)" transform="translate(30, 25)">
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header -->
    <rect x="0" y="0" width="340" height="42" rx="12" fill="url(#teamGrad)"/>
    <rect x="0" y="24" width="340" height="18" fill="url(#teamGrad)"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">TEAM STRUCTURE &amp; KPI SYNC</text>

    <!-- Organizational Chart -->
    <rect x="18" y="56" width="304" height="158" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Lines -->
    <line x1="170" y1="88" x2="170" y2="110" stroke="#94A3B8" stroke-width="1"/>
    <line x1="85" y1="110" x2="255" y2="110" stroke="#94A3B8" stroke-width="1"/>
    <line x1="85" y1="110" x2="85" y2="130" stroke="#94A3B8" stroke-width="1"/>
    <line x1="170" y1="110" x2="170" y2="130" stroke="#94A3B8" stroke-width="1"/>
    <line x1="255" y1="110" x2="255" y2="130" stroke="#94A3B8" stroke-width="1"/>

    <!-- CEO Node -->
    <rect x="120" y="66" width="100" height="22" rx="6" fill="#0B132B" stroke="#A78BFA" stroke-width="1"/>
    <text x="170" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF">CEO / Visionary</text>

    <!-- Managers -->
    <rect x="40" y="130" width="90" height="24" rx="4" fill="#334155"/>
    <text x="85" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#E2E8F0">Sales Manager</text>

    <rect x="125" y="130" width="90" height="24" rx="4" fill="#334155"/>
    <text x="170" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#E2E8F0">Operations Lead</text>

    <rect x="210" y="130" width="90" height="24" rx="4" fill="#334155"/>
    <text x="255" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#E2E8F0">Finance Ctrl</text>

    <!-- KPI Matrix Footer -->
    <rect x="28" y="168" width="284" height="34" rx="4" fill="#0B132B"/>
    <text x="36" y="182" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#94A3B8">AUTOMATED KPI SYNC</text>
    <text x="36" y="194" font-family="Inter, sans-serif" font-size="7" fill="#10B981">100% Team Accountability &amp; Pre-Scheduled Meetings Active</text>
    <rect x="282" y="174" width="22" height="22" rx="11" fill="#7C3AED"/>
    <text x="293" y="188" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF">✓</text>
  </g>
</svg>
