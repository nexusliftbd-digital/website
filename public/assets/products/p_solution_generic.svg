<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad7" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </radialGradient>
    <filter id="solShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0B1733" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#bgGrad7)"/>

  <!-- 3D BLUEPRINT ARCHITECTURE FOLDER -->
  <g transform="translate(95, 20)">
    <rect x="0" y="0" width="210" height="190" rx="8" fill="#FFFFFF" stroke="#0B1733" stroke-width="1.5" filter="url(#solShadow)"/>

    <!-- Blueprint Technical Top -->
    <rect x="0" y="0" width="210" height="24" rx="6" fill="#0B1733"/>
    <text x="14" y="16" font-family="Inter, sans-serif" font-size="7.5" font-weight="900" fill="#43A7E8" letter-spacing="0.1em">NEXUS INFRASTRUCTURE BLUEPRINT</text>

    <!-- Connected 3D Node Grid on Paper -->
    <g transform="translate(18, 36)">
      <text x="0" y="10" font-family="Inter, sans-serif" font-size="8.5" font-weight="900" fill="#0B1733">ENTERPRISE CAPABILITY LAYER</text>
      <text x="0" y="19" font-family="Inter, sans-serif" font-size="5" font-weight="700" fill="#64748B">BESPOKE SYSTEMS · APIS · AUTOMATION</text>

      <!-- 4 Connected Nodes -->
      <g transform="translate(0, 28)">
        <!-- Node 1 -->
        <rect x="0" y="0" width="78" height="34" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
        <circle cx="12" cy="17" r="4" fill="#0B1733"/>
        <text x="22" y="15" font-family="Inter, sans-serif" font-size="5" font-weight="800" fill="#0B1733">BRAND &amp; SOP</text>
        <text x="22" y="22" font-family="Inter, sans-serif" font-size="4" font-weight="600" fill="#64748B">Documented</text>

        <!-- Node 2 -->
        <rect x="96" y="0" width="78" height="34" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
        <circle cx="108" cy="17" r="4" fill="#10B981"/>
        <text x="118" y="15" font-family="Inter, sans-serif" font-size="5" font-weight="800" fill="#0B1733">CRM &amp; LEADS</text>
        <text x="118" y="22" font-family="Inter, sans-serif" font-size="4" font-weight="600" fill="#10B981">Auto Router</text>

        <!-- Connecting Lines -->
        <path d="M 78 17 L 96 17" stroke="#43A7E8" stroke-width="2" stroke-dasharray="2 2"/>
        <path d="M 39 34 L 39 46 M 135 34 L 135 46" stroke="#43A7E8" stroke-width="2" stroke-dasharray="2 2"/>

        <!-- Node 3 -->
        <rect x="0" y="46" width="78" height="34" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
        <circle cx="12" cy="63" r="4" fill="#F59E0B"/>
        <text x="22" y="61" font-family="Inter, sans-serif" font-size="5" font-weight="800" fill="#0B1733">AI AGENTS</text>
        <text x="22" y="68" font-family="Inter, sans-serif" font-size="4" font-weight="600" fill="#64748B">24/7 Gemini Pro</text>

        <!-- Node 4 -->
        <rect x="96" y="46" width="78" height="34" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
        <circle cx="108" cy="63" r="4" fill="#43A7E8"/>
        <text x="118" y="61" font-family="Inter, sans-serif" font-size="5" font-weight="800" fill="#1D4ED8">CONTROL OS</text>
        <text x="118" y="68" font-family="Inter, sans-serif" font-size="4" font-weight="700" fill="#1D4ED8">Verified Live</text>

        <path d="M 78 63 L 96 63" stroke="#43A7E8" stroke-width="2" stroke-dasharray="2 2"/>
      </g>
    </g>
  </g>
</svg>
