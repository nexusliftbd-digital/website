<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFounder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="founderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <filter id="shadowFounder" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgFounder)"/>

  <g filter="url(#shadowFounder)" transform="translate(30, 25)">
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#000000" stroke="#334155" stroke-width="1.5"/>

    <!-- Header Panel -->
    <rect x="0" y="0" width="340" height="42" rx="12" fill="url(#founderGrad)"/>
    <rect x="0" y="24" width="340" height="18" fill="url(#founderGrad)"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#E2E8F0">ENTERPRISE OS &amp; CEO DASHBOARD</text>

    <!-- Master Grid System -->
    <!-- Left Radar / Chart -->
    <rect x="18" y="56" width="144" height="156" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="28" y="74" font-family="Inter, sans-serif" font-size="8" font-weight="900" fill="#94A3B8">360° BUSINESS RADAR</text>

    <!-- Circular Radar -->
    <circle cx="90" cy="130" r="45" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="90" cy="130" r="30" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="90" cy="130" r="15" fill="none" stroke="#1E293B" stroke-width="1"/>

    <!-- Radar Polygon -->
    <polygon points="90,95 120,120 100,165 70,150 55,120" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Right Live Feed / Metrics -->
    <rect x="178" y="56" width="144" height="74" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="188" y="74" font-family="Inter, sans-serif" font-size="8" font-weight="900" fill="#10B981">LIVE DECISION MATRIX</text>
    <rect x="188" y="86" width="124" height="14" rx="3" fill="#0B132B"/>
    <text x="194" y="96" font-family="Inter, sans-serif" font-size="6.5" fill="#94A3B8">Q4 Target Hit: 92%</text>
    <rect x="188" y="106" width="124" height="14" rx="3" fill="#0B132B"/>
    <text x="194" y="116" font-family="Inter, sans-serif" font-size="6.5" fill="#38BDF8">Risk Detection: Zero Alerts</text>

    <!-- Bottom Controls -->
    <rect x="178" y="138" width="144" height="74" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="188" y="156" font-family="Inter, sans-serif" font-size="8" font-weight="900" fill="#818CF8">EXECUTIVE OVERRIDE</text>

    <rect x="188" y="168" width="60" height="28" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
    <text x="218" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#E2E8F0">Lock Systems</text>

    <rect x="252" y="168" width="60" height="28" rx="4" fill="#E11D48"/>
    <text x="282" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#FFFFFF">Execute Scale</text>
  </g>
</svg>
