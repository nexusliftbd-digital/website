<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="logGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadowLog" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgLog)"/>

  <g filter="url(#shadowLog)" transform="translate(30, 25)">
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header Panel -->
    <rect x="0" y="0" width="340" height="42" rx="12" fill="url(#logGrad)"/>
    <rect x="0" y="24" width="340" height="18" fill="url(#logGrad)"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">LIVE ORDER LOG &amp; PIPELINE DISPATCH</text>

    <!-- Table Container -->
    <rect x="18" y="56" width="304" height="158" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Table Header -->
    <rect x="30" y="68" width="280" height="20" rx="3" fill="#0B132B"/>
    <text x="38" y="81" font-family="Inter, sans-serif" font-size="6.5" font-weight="900" fill="#94A3B8">ID</text>
    <text x="70" y="81" font-family="Inter, sans-serif" font-size="6.5" font-weight="900" fill="#94A3B8">CUSTOMER / PRODUCT</text>
    <text x="185" y="81" font-family="Inter, sans-serif" font-size="6.5" font-weight="900" fill="#94A3B8">PRICE</text>
    <text x="240" y="81" font-family="Inter, sans-serif" font-size="6.5" font-weight="900" fill="#94A3B8">STATUS</text>

    <!-- Row 1 -->
    <rect x="30" y="92" width="280" height="26" rx="3" fill="#0F172A"/>
    <text x="38" y="108" font-family="Inter, sans-serif" font-size="6.5" font-weight="700" fill="#38BDF8">#1042</text>
    <text x="70" y="104" font-family="Inter, sans-serif" font-size="6.5" font-weight="800" fill="#E2E8F0">Anisur Rahman</text>
    <text x="70" y="113" font-family="Inter, sans-serif" font-size="5.5" fill="#94A3B8">Corporate Profile Master</text>
    <text x="185" y="108" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#38BDF8">৳৪,৯৯৯</text>
    <rect x="240" y="98" width="60" height="14" rx="3" fill="#064E3B"/>
    <text x="270" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" font-weight="900" fill="#6EE7B7">Dispatched</text>

    <!-- Row 2 -->
    <rect x="30" y="122" width="280" height="26" rx="3" fill="#0F172A"/>
    <text x="38" y="138" font-family="Inter, sans-serif" font-size="6.5" font-weight="700" fill="#38BDF8">#1043</text>
    <text x="70" y="134" font-family="Inter, sans-serif" font-size="6.5" font-weight="800" fill="#E2E8F0">Farhana Yasmin</text>
    <text x="70" y="143" font-family="Inter, sans-serif" font-size="5.5" fill="#94A3B8">F-Commerce Automation OS</text>
    <text x="185" y="138" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#38BDF8">৳৯,৯৯৯</text>
    <rect x="240" y="128" width="60" height="14" rx="3" fill="#1E3A8A"/>
    <text x="270" y="138" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" font-weight="900" fill="#93C5FD">In Progress</text>

    <!-- Row 3 -->
    <rect x="30" y="152" width="280" height="26" rx="3" fill="#0F172A"/>
    <text x="38" y="168" font-family="Inter, sans-serif" font-size="6.5" font-weight="700" fill="#38BDF8">#1044</text>
    <text x="70" y="164" font-family="Inter, sans-serif" font-size="6.5" font-weight="800" fill="#E2E8F0">Tariqul Islam</text>
    <text x="70" y="173" font-family="Inter, sans-serif" font-size="5.5" fill="#94A3B8">Make.com Webhook Funnel</text>
    <text x="185" y="168" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#38BDF8">৳১৪,৯৯৯</text>
    <rect x="240" y="158" width="60" height="14" rx="3" fill="#78350F"/>
    <text x="270" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" font-weight="900" fill="#FCD34D">New Intake</text>

    <!-- Bottom summary row -->
    <rect x="30" y="182" width="280" height="22" rx="3" fill="#0B132B"/>
    <text x="40" y="196" font-family="Inter, sans-serif" font-size="6.5" font-weight="800" fill="#94A3B8">Total Orders Logged: 1,428</text>
    <text x="290" y="196" text-anchor="end" font-family="Inter, sans-serif" font-size="6.5" font-weight="900" fill="#10B981">100% Synced to CRM</text>
  </g>
</svg>
