<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <filter id="shadowAi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgAi)"/>

  <g filter="url(#shadowAi)" transform="translate(30, 25)">
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header -->
    <rect x="0" y="0" width="340" height="42" rx="12" fill="url(#aiGrad)"/>
    <rect x="0" y="24" width="340" height="18" fill="url(#aiGrad)"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">AI &amp; MAKE.COM WEBHOOK ORCHESTRATOR</text>

    <!-- Node Network -->
    <rect x="18" y="56" width="304" height="158" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Connection Paths -->
    <path d="M 64 125 C 100 125, 120 95, 170 95" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="2 2"/>
    <path d="M 64 125 C 100 125, 120 155, 170 155" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="2 2"/>
    <path d="M 230 95 C 260 95, 270 125, 296 125" fill="none" stroke="#10B981" stroke-width="2"/>
    <path d="M 230 155 C 260 155, 270 125, 296 125" fill="none" stroke="#10B981" stroke-width="2"/>

    <!-- Left Trigger Node -->
    <rect x="28" y="110" width="36" height="30" rx="18" fill="#0B132B" stroke="#818CF8" stroke-width="1"/>
    <text x="46" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#818CF8">⚡</text>
    <text x="46" y="152" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="#94A3B8">Website</text>

    <!-- Center Logic Nodes -->
    <rect x="170" y="80" width="60" height="30" rx="6" fill="#312E81"/>
    <text x="200" y="97" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="800" fill="#E0E7FF">Make.com</text>

    <rect x="170" y="140" width="60" height="30" rx="6" fill="#1E3A8A"/>
    <text x="200" y="157" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="800" fill="#DBEAFE">AI Processor</text>

    <!-- Right Destination Node -->
    <rect x="296" y="110" width="30" height="30" rx="6" fill="#064E3B" stroke="#34D399" stroke-width="1"/>
    <text x="311" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#34D399">💬</text>
    <text x="311" y="152" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="#94A3B8">WhatsApp</text>

    <!-- Floating status badge -->
    <rect x="115" y="176" width="110" height="20" rx="10" fill="#10B981"/>
    <text x="170" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#064E3B">Auto-Scaling Infrastructure</text>
  </g>
</svg>
