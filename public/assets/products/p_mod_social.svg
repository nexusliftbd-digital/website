    <filter id="shadowSocial" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgSocial)"/>

  <g filter="url(#shadowSocial)" transform="translate(30, 25)">
