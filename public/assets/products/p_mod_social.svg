    <text x="190" y="138" font-family="Inter, sans-serif" font-size="6.5" font-weight="800" fill="#E2E8F0">Steadfast Courier Proof</text>
    <text x="190" y="146" font-family="Inter, sans-serif" font-size="5.5" fill="#38BDF8">● 96.8% Delivery Rate</text>

    <rect x="184" y="156" width="116" height="34" rx="4" fill="#1E3A8A"/>
    <text x="190" y="168" font-family="Inter, sans-serif" font-size="6.5" font-weight="800" fill="#93C5FD">🛡️ Instant Trust Signal</text>
