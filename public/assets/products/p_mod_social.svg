      <text x="8" y="26" font-family="Inter, sans-serif" font-size="5.5" fill="#E2E8F0">&quot;Returns down from 18%</text>
      <text x="8" y="36" font-family="Inter, sans-serif" font-size="5.5" fill="#E2E8F0">to 4.2% in 30 days!&quot;</text>
      <text x="8" y="44" font-family="Inter, sans-serif" font-size="5" font-weight="700" fill="#38BDF8">— Kabir H., D2C Brand</text>

      <rect x="0" y="54" width="114" height="46" rx="4" fill="#064E3B"/>
      <text x="8" y="68" font-family="Inter, sans-serif" font-size="6.5" font-weight="900" fill="#6EE7B7">📈 Revenue Lift</text>
      <text x="8" y="80" font-family="Inter, sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF">+৳১২,৫০,০০০/mo</text>
