      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="socialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
