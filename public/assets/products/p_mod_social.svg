    <rect x="174" y="68" width="136" height="134" rx="6" fill="#0B132B"/>
    <text x="184" y="86" font-family="Inter, sans-serif" font-size="8" font-weight="900" fill="#38BDF8">🎥 CASE ASSET VAULT</text>

    <rect x="184" y="96" width="116" height="26" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="190" y="108" font-family="Inter, sans-serif" font-size="6.5" font-weight="800" fill="#E2E8F0">Video Testimonial HD</text>
    <text x="190" y="116" font-family="Inter, sans-serif" font-size="5.5" fill="#10B981">● 14 High-Res Clips</text>

