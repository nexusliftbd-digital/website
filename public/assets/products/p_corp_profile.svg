<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCorp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020C1E"/>
      <stop offset="100%" stop-color="#0F2B5C"/>
    </linearGradient>
    <filter id="shadowCorp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGradCorp)"/>

  <!-- Institutional Master Binder Deck -->
  <g filter="url(#shadowCorp)" transform="translate(60, 30)">
    <!-- Binder spine shadow & stack -->
    <rect x="25" y="15" width="225" height="215" rx="8" fill="#1E293B"/>
    <rect x="12" y="8" width="225" height="215" rx="8" fill="#334155"/>
    <rect x="0" y="0" width="225" height="215" rx="8" fill="#FFFFFF"/>

    <!-- Gold Institutional Seal -->
    <rect x="20" y="20" width="185" height="48" rx="6" fill="#0B1733"/>
    <text x="32" y="42" font-family="Inter, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1">INSTITUTIONAL MASTER</text>
    <text x="32" y="56" font-family="Inter, sans-serif" font-weight="700" font-size="8" fill="#38BDF8">30–40 Pages • Tender & Bank Ready</text>

    <!-- Financial Matrix Table -->
    <rect x="20" y="80" width="185" height="60" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="28" y="92" width="60" height="6" rx="2" fill="#0B1733"/>
    <rect x="100" y="92" width="40" height="6" rx="2" fill="#10B981"/>
    <rect x="150" y="92" width="45" height="6" rx="2" fill="#0B1733"/>

    <rect x="28" y="108" width="167" height="1" fill="#E2E8F0"/>
    <rect x="28" y="118" width="50" height="5" rx="2" fill="#64748B"/>
    <rect x="100" y="118" width="35" height="5" rx="2" fill="#64748B"/>
    <rect x="150" y="118" width="40" height="5" rx="2" fill="#64748B"/>

    <rect x="28" y="128" width="50" height="5" rx="2" fill="#64748B"/>
    <rect x="100" y="128" width="35" height="5" rx="2" fill="#64748B"/>
    <rect x="150" y="128" width="40" height="5" rx="2" fill="#64748B"/>

    <!-- Compliance Stamp -->
    <rect x="20" y="152" width="185" height="42" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="32" y="170" font-family="Inter, sans-serif" font-weight="900" font-size="9" fill="#065F46">GOVT TENDER & AUDIT VERIFIED</text>
    <text x="32" y="184" font-family="Inter, sans-serif" font-size="7.5" fill="#047857">ISO/Compliant Architecture + Financial Audit Proof</text>
  </g>

  <!-- Seal Ribbon -->
  <g transform="translate(265, 18)">
    <circle cx="25" cy="25" r="25" fill="#F59E0B" filter="url(#shadowCorp)"/>
    <text x="25" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="8" fill="#FFFFFF">CORP</text>
    <text x="25" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="8" fill="#FFFFFF">৳2,999</text>
  </g>
</svg>
