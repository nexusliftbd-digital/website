<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDelegate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="delegateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadowDelegate" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgDelegate)"/>

  <g filter="url(#shadowDelegate)" transform="translate(30, 25)">
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header Panel -->
    <rect x="0" y="0" width="340" height="42" rx="12" fill="url(#delegateGrad)"/>
    <rect x="0" y="24" width="340" height="18" fill="url(#delegateGrad)"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">DELEGATION MATRIX &amp; RACI PROTOCOL</text>

    <!-- Content Matrix -->
    <rect x="18" y="56" width="304" height="158" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- RACI Table Header -->
    <rect x="30" y="68" width="280" height="22" rx="4" fill="#0B132B"/>
    <text x="40" y="82" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#94A3B8">BUSINESS OPERATION</text>
    <text x="175" y="82" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#38BDF8">R (Lead)</text>
    <text x="225" y="82" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#10B981">A (Signoff)</text>
    <text x="275" y="82" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#818CF8">C/I (Team)</text>

    <!-- Row 1: Marketing / Ads -->
    <rect x="30" y="94" width="280" height="24" rx="4" fill="#0F172A"/>
    <text x="40" y="109" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#E2E8F0">Facebook Ad Scaler</text>
    <text x="175" y="109" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#38BDF8">Media Buyer</text>
    <text x="225" y="109" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#10B981">Founder</text>
    <text x="275" y="109" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#818CF8">Designer</text>

    <!-- Row 2: Customer Care -->
    <rect x="30" y="122" width="280" height="24" rx="4" fill="#0F172A"/>
    <text x="40" y="137" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#E2E8F0">Inbox Order Closing</text>
    <text x="175" y="137" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#38BDF8">Sales Team</text>
    <text x="225" y="137" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#10B981">Ops Mgr</text>
    <text x="275" y="137" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#818CF8">Courier</text>

    <!-- Row 3: Dispatch / Returns -->
    <rect x="30" y="150" width="280" height="24" rx="4" fill="#0F172A"/>
    <text x="40" y="165" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#E2E8F0">Courier Dispatch Audit</text>
    <text x="175" y="165" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#38BDF8">Packer</text>
    <text x="225" y="165" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#10B981">Ops Mgr</text>
    <text x="275" y="165" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#818CF8">Accountant</text>

    <!-- Bottom Status Banner -->
    <rect x="30" y="178" width="280" height="26" rx="4" fill="#064E3B"/>
    <text x="170" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#A7F3D0">✓ 100% Founder Autonomy — No Daily Intervention Required</text>
  </g>
</svg>
