<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1733"/>
      <stop offset="100%" stop-color="#1971A5"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B1733" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGrad1)"/>

  <!-- Document Deck Mockup -->
  <g filter="url(#shadow1)" transform="translate(60, 35)">
    <!-- Back Page -->
    <rect x="25" y="10" width="230" height="210" rx="10" fill="#E2E8F0" opacity="0.6"/>
    <!-- Middle Page -->
    <rect x="12" y="5" width="230" height="210" rx="10" fill="#F8FAFC" opacity="0.85"/>
    <!-- Front Master Cover -->
    <rect x="0" y="0" width="230" height="210" rx="10" fill="url(#cardGrad1)"/>

    <!-- Cover Elements -->
    <rect x="20" y="24" width="80" height="12" rx="4" fill="#0B1733"/>
    <rect x="20" y="44" width="140" height="8" rx="3" fill="#1971A5"/>

    <!-- Visual Badge -->
    <rect x="20" y="70" width="190" height="70" rx="8" fill="#EAF6FF" stroke="#BAE6FD" stroke-width="1.5"/>
    <circle cx="50" cy="105" r="18" fill="#1971A5"/>
    <path d="M44 105 L48 109 L57 100" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="80" y="92" width="110" height="8" rx="2" fill="#0B1733"/>
    <rect x="80" y="108" width="80" height="6" rx="2" fill="#64748B"/>

    <!-- Document Lines -->
    <rect x="20" y="156" width="190" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="168" width="160" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="180" width="120" height="6" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- Stamp / Verified Badge -->
  <g transform="translate(260, 200)">
    <circle cx="28" cy="28" r="28" fill="#43A7E8" filter="url(#shadow1)"/>
    <text x="28" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="10" fill="#0B1733" letter-spacing="1">STARTER</text>
    <text x="28" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="9" fill="#FFFFFF">৳999</text>
  </g>
</svg>
