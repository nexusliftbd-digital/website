<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgConvert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="convertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="shadowConvert" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgConvert)"/>

  <g filter="url(#shadowConvert)" transform="translate(30, 25)">
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header Panel -->
    <rect x="0" y="0" width="340" height="42" rx="12" fill="url(#convertGrad)"/>
    <rect x="0" y="24" width="340" height="18" fill="url(#convertGrad)"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">INBOX CONVERSION &amp; SALES SCRIPTS</text>

    <!-- Main Container -->
    <rect x="18" y="56" width="304" height="158" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Left: Objection Handling Matrix -->
    <rect x="30" y="68" width="134" height="134" rx="6" fill="#0B132B"/>
    <text x="40" y="86" font-family="Inter, sans-serif" font-size="8" font-weight="900" fill="#38BDF8">💬 OBJECTION CLOSING</text>

    <g transform="translate(40, 96)">
      <rect x="0" y="0" width="114" height="22" rx="3" fill="#1E293B"/>
      <text x="6" y="14" font-family="Inter, sans-serif" font-size="6.5" font-weight="700" fill="#E2E8F0">&quot;দাম বেশি&quot; → ROI Pivot</text>

      <rect x="0" y="26" width="114" height="22" rx="3" fill="#1E293B"/>
      <text x="6" y="40" font-family="Inter, sans-serif" font-size="6.5" font-weight="700" fill="#E2E8F0">&quot;পরে নিব&quot; → Scarcity Lock</text>

      <rect x="0" y="52" width="114" height="22" rx="3" fill="#1E293B"/>
      <text x="6" y="66" font-family="Inter, sans-serif" font-size="6.5" font-weight="700" fill="#E2E8F0">&quot;অগ্রিম কেন?&quot; → Trust Token</text>

      <rect x="0" y="78" width="114" height="22" rx="3" fill="#064E3B"/>
      <text x="6" y="92" font-family="Inter, sans-serif" font-size="6.5" font-weight="800" fill="#6EE7B7">✓ Closing Rate: +28%</text>
    </g>

    <!-- Right: Sales Automation Flow -->
    <rect x="174" y="68" width="136" height="134" rx="6" fill="#0B132B"/>
    <text x="184" y="86" font-family="Inter, sans-serif" font-size="8" font-weight="900" fill="#10B981">⚡ INSTANT REPLY SCRIPTS</text>

    <rect x="184" y="96" width="116" height="26" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="190" y="108" font-family="Inter, sans-serif" font-size="6.5" font-weight="800" fill="#E2E8F0">3-Second Auto-Hook</text>
    <text x="190" y="116" font-family="Inter, sans-serif" font-size="5.5" fill="#38BDF8">● High Engagement</text>

    <rect x="184" y="126" width="116" height="26" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="190" y="138" font-family="Inter, sans-serif" font-size="6.5" font-weight="800" fill="#E2E8F0">Upsell Bundle Trigger</text>
    <text x="190" y="146" font-family="Inter, sans-serif" font-size="5.5" fill="#10B981">● +৳450 AOV Lift</text>

    <rect x="184" y="156" width="116" height="34" rx="4" fill="#1E3A8A"/>
    <text x="190" y="168" font-family="Inter, sans-serif" font-size="6.5" font-weight="800" fill="#93C5FD">🎯 One-Click Checkout</text>
    <text x="190" y="180" font-family="Inter, sans-serif" font-size="6" fill="#BFDBFE">WhatsApp Pre-filled Link</text>
  </g>
</svg>
