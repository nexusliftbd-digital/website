<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071127"/>
      <stop offset="100%" stop-color="#0B1733"/>
    </linearGradient>
    <linearGradient id="kpiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="shadowKpi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgKpi)"/>

  <g filter="url(#shadowKpi)" transform="translate(30, 25)">
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header Panel -->
    <rect x="0" y="0" width="340" height="42" rx="12" fill="url(#kpiGrad)"/>
    <rect x="0" y="24" width="340" height="18" fill="url(#kpiGrad)"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">EXECUTIVE KPI &amp; VELOCITY DASHBOARD</text>

    <!-- Main Grid -->
    <rect x="18" y="56" width="304" height="158" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Metric Card 1: Revenue Velocity -->
    <rect x="30" y="68" width="90" height="64" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="40" y="84" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#94A3B8">DAILY REVENUE</text>
    <text x="40" y="104" font-family="Inter, sans-serif" font-size="13" font-weight="900" fill="#38BDF8">৳৪৫,২০০</text>
    <text x="40" y="122" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#10B981">↑ +18% Target</text>

    <!-- Metric Card 2: CAC / Return -->
    <rect x="126" y="68" width="90" height="64" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="136" y="84" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#94A3B8">RETURN RATE</text>
    <text x="136" y="104" font-family="Inter, sans-serif" font-size="13" font-weight="900" fill="#10B981">৩.২%</text>
    <text x="136" y="122" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#38BDF8">Benchmark: &lt;5%</text>

    <!-- Metric Card 3: ROAS / ROI -->
    <rect x="222" y="68" width="88" height="64" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="232" y="84" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#94A3B8">BLENDED ROAS</text>
    <text x="232" y="104" font-family="Inter, sans-serif" font-size="13" font-weight="900" fill="#818CF8">৪.৮x</text>
    <text x="232" y="122" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#10B981">High Profit</text>

    <!-- Bar Chart Visual -->
    <g transform="translate(30, 142)">
      <rect x="0" y="0" width="280" height="60" rx="6" fill="#0B132B"/>
      <!-- Grid Lines -->
      <line x1="10" y1="48" x2="270" y2="48" stroke="#1E293B" stroke-width="1"/>
      <line x1="10" y1="28" x2="270" y2="28" stroke="#1E293B" stroke-width="1"/>

      <!-- Bars -->
      <rect x="30" y="24" width="16" height="24" rx="2" fill="#38BDF8"/>
      <rect x="70" y="16" width="16" height="32" rx="2" fill="#38BDF8"/>
      <rect x="110" y="10" width="16" height="38" rx="2" fill="#10B981"/>
      <rect x="150" y="14" width="16" height="34" rx="2" fill="#38BDF8"/>
      <rect x="190" y="6" width="16" height="42" rx="2" fill="#10B981"/>
      <rect x="230" y="4" width="16" height="44" rx="2" fill="#38BDF8"/>

      <!-- Labels -->
      <text x="38" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="#64748B">Sat</text>
      <text x="78" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="#64748B">Sun</text>
      <text x="118" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="#64748B">Mon</text>
      <text x="158" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="#64748B">Tue</text>
      <text x="198" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="#64748B">Wed</text>
      <text x="238" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" fill="#64748B">Thu</text>
    </g>
  </g>
</svg>
